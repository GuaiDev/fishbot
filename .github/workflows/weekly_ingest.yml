name: Weekly Data Ingest

on:
  schedule:
    # Every Sunday at 6am UTC (2am EDT / 1am EST)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Ontario ────────────────────────────────────────────────────────────

      - name: Ingest Grand River / Dunnville
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.FISHBOT_API_KEY }}" \
            -d '{"lat": 42.917, "lng": -79.774, "radius_km": 50, "label": "Grand River Dunnville"}' \
            https://web-production-e2094.up.railway.app/ingest/data
          echo ""
          sleep 5

      - name: Ingest Credit River / Mississauga
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.FISHBOT_API_KEY }}" \
            -d '{"lat": 43.55, "lng": -79.65, "radius_km": 30, "label": "Credit River Mississauga"}' \
            https://web-production-e2094.up.railway.app/ingest/data
          echo ""
          sleep 5

      - name: Ingest Bronte Creek / Oakville
