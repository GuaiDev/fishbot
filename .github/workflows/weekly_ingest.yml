          sleep 5

      # ── British Columbia — global sources ─────────────────────────────────
      # iNat, GBIF, WSC, OSM via /ingest/data (same as Ontario)

      - name: BC iNat/GBIF/WSC/OSM — Fraser River / Lower Mainland
